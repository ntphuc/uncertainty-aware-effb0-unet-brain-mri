project_name: U-Mamba_Bot (official-architecture adapter)
paper_name: U-Mamba_Bot
citation_key: ma2024umamba
implementation: Standalone 2D adapter of the authors residual CNN encoder-decoder with a mamba_ssm layer at the bottleneck
seed: 42

paths:
  x_train: datasets/brisc2025/X_train.npy
  y_train: datasets/brisc2025/Y_train.npy
  x_test: datasets/brisc2025/X_test.npy
  y_test: datasets/brisc2025/Y_test.npy
  output_dir: outputs/paper_baselines/umamba_bot

model:
  name: umamba_bot_official
  in_channels: 1
  num_classes: 1
  input_size: 256
  channels: [32, 64, 128, 256, 320, 320]
  strides: [1, 2, 2, 2, 2, 2]
  encoder_blocks: 2
  decoder_blocks: 2
  d_state: 16
  d_conv: 4
  expand: 2
  conv_bias: true
  use_deep_supervision: false

training:
  split_seed: 42
  image_size: 256
  batch_size: 2
  accumulation_steps: 4
  num_workers: 2
  epochs: 50
  val_ratio: 0.15
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: false
  deterministic: true
  threshold: 0.5
  save_every: 10

loss:
  lambda_boundary: 0.0
  beta_deep_supervision: 0.0
  boundary_kernel_size: 3
  gamma_tversky: 0.0

augmentation:
  horizontal_flip: true
  vertical_flip: false
  random_rotate90: true
