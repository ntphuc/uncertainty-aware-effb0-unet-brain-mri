project_name: VM-UNet (official)
paper_name: VM-UNet
citation_key: ruan2024vmunet
implementation: Direct adapter around VSSM from the authors official JCruan519/VM-UNet repository
seed: 42

paths:
  x_train: datasets/brisc2025/X_train.npy
  y_train: datasets/brisc2025/Y_train.npy
  x_test: datasets/brisc2025/X_test.npy
  y_test: datasets/brisc2025/Y_test.npy
  output_dir: outputs/paper_baselines/vmunet_official

model:
  name: vmunet_official
  in_channels: 1
  num_classes: 1
  repo_path: external/VM-UNet
  depths: [2, 2, 9, 2]
  depths_decoder: [2, 9, 2, 2]
  drop_path_rate: 0.2
  repeat_grayscale_to_rgb: true
  load_ckpt_path: null

training:
  split_seed: 42
  image_size: 256
  batch_size: 2
  accumulation_steps: 4
  num_workers: 2
  epochs: 50
  val_ratio: 0.15
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  deterministic: true
  threshold: 0.5
  save_every: 10

loss:
  lambda_boundary: 0.0
  beta_deep_supervision: 0.0
  boundary_kernel_size: 3
  gamma_tversky: 0.0

augmentation:
  horizontal_flip: true
  vertical_flip: false
  random_rotate90: true
