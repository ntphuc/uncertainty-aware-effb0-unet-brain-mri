project_name: BE_UNet_EfficientB0_Boundary
seed: 42
paths:
  x_train: datasets/brisc2025/X_train.npy
  y_train: datasets/brisc2025/Y_train.npy
  x_test: datasets/brisc2025/X_test.npy
  y_test: datasets/brisc2025/Y_test.npy
  output_dir: outputs/ablations/m4_boundary
model:
  name: efficientnet_b0_unet_boundary
  encoder_name: efficientnet_b0
  pretrained: true
  in_channels: 1
  num_classes: 1
  decoder_channels:
  - 256
  - 160
  - 96
  - 64
  - 32
  ms_channels: 24
  use_multiscale: true
  use_se: true
  use_boundary_head: true
  use_deep_supervision: false
training:
  image_size: 256
  batch_size: 8
  num_workers: 2
  epochs: 50
  val_ratio: 0.15
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  threshold: 0.5
  save_every: 10
loss:
  lambda_boundary: 0.15
  beta_deep_supervision: 0.0
  boundary_kernel_size: 3
augmentation:
  horizontal_flip: true
  vertical_flip: false
  random_rotate90: true
