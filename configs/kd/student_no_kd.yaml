project_name: student_no_kd_multiscale_efficientnet
seed: 42

paths:
  x_train: datasets/brisc2025/X_train.npy
  y_train: datasets/brisc2025/Y_train.npy
  x_test: datasets/brisc2025/X_test.npy
  y_test: datasets/brisc2025/Y_test.npy
  output_dir: outputs/kd_ablation/student_no_kd

model:
  name: efficientnet_b0_unet_boundary
  encoder_name: efficientnet_b0
  pretrained: true
  in_channels: 1
  num_classes: 1
  decoder_channels: [256, 160, 96, 64, 32]
  ms_channels: 24
  use_multiscale: true
  use_se: false
  use_boundary_head: false
  use_deep_supervision: false

training:
  image_size: 256
  batch_size: 8
  num_workers: 2
  epochs: 80
  val_ratio: 0.15
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  threshold: 0.5
  save_every: 10
  grad_clip: 1.0

loss:
  lambda_boundary: 0.10
  beta_deep_supervision: 0.25
  boundary_kernel_size: 3
  gamma_tversky: 0.0

kd:
  enabled: false

augmentation:
  horizontal_flip: true
  vertical_flip: false
  random_rotate90: true
  lesion_crop_prob: 0.0
  intensity_aug: true
  noise_std: 0.02
  contrast_range: [0.9, 1.1]
  brightness_range: [-0.03, 0.03]
